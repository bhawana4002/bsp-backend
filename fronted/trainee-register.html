<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Trainee Registration - BSP</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="bg-animation"><div class="coil coil-1"></div><div class="coil coil-2"></div></div>
    <div class="container" style="max-width: 600px;">
        <h2>Trainee Registration</h2>
        <p style="margin-bottom:20px;">Bhilai Steel Plant - C&IT</p>
        
        <form id="registerForm">
            <div class="input-group"><label>Year (YYYY)</label><input type="number" id="yyyy" placeholder="e.g. 2026" required></div>
            <div class="input-group"><label>Roll Number</label><input type="text" id="rollNumber" placeholder="e.g. P.25/5612" required></div>
            <div class="input-group"><label>Full Name</label><input type="text" id="name" placeholder="Enter Full Name" required></div>
            <div class="input-group"><label>College</label><input type="text" id="college" placeholder="College Name" required></div>
            <div class="input-group"><label>Training From Date</label><input type="date" id="fromDate" required></div>
            <div class="input-group"><label>Training To Date</label><input type="date" id="toDate" required></div>
            <div class="input-group"><label>Guide Name</label><input type="text" id="guideName" placeholder="Guide Name"></div>
            <div class="input-group"><label>Project Title</label><input type="text" id="projectTitle" placeholder="Project Title"></div>
            <div class="input-group"><label>Password</label><input type="password" id="password" placeholder="Create Password" required></div>
            
            <button type="submit" class="btn" id="submitBtn">Register Trainee</button>
            <div id="messageBox" class="message-box"></div>
        </form>
        
        <p style="margin-top:20px;">Already Registered? <a href="trainee-login.html" style="color:#f39c12;">Login Here</a></p>
    </div>
    <script src="toast.js"></script>
    <script src="trainee-register.js"></script>
</body>
</html>
