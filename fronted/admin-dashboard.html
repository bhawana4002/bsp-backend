<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Admin Dashboard - BSP C&IT</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="bg-animation"><div class="coil coil-1"></div><div class="coil coil-2"></div></div>
    <div class="dashboard-container" style="max-width: 1200px;">
        <div class="top-bar">
            <h2>👨‍💼 Admin Dashboard</h2>
            <div style="display: flex; gap: 10px;">
                <button class="btn" style="width: auto; padding: 8px 15px; background: #3498db; color: white; margin: 0;" onclick="window.location.href='attendance.html';">📅 Attendance</button>
                <button class="btn-logout" onclick="localStorage.removeItem('loggedInAdmin'); window.location.href='admin-login.html';">Logout</button>
            </div>
        </div>
        <div class="table-container">
            <h3>Registered Trainees List</h3>
            <table>
                <thead>
                    <tr>
                        <th>Year</th><th>Roll No</th><th>Name</th><th>College</th><th>Project</th><th>Status</th><th>Actions</th>
                    </tr>
                </thead>
                <tbody id="traineeTableBody"></tbody>
            </table>
        </div>
    </div>
    <script src="toast.js"></script>
    <script src="admin-dashboard.js"></script>
</body>
</html>
