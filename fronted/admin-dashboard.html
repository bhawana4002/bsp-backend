<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Admin Dashboard - BSP C&IT</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="bg-animation">
        <div class="coil coil-1"></div><div class="coil coil-2"></div>
    </div>
    
    <div class="dashboard-container" style="max-width: 1100px;">
        
        <!-- Top Bar -->
        <div class="top-bar">
            <h2>👨‍💼 Admin Dashboard</h2>
            <button class="btn-logout" onclick="localStorage.removeItem('loggedInAdmin'); window.location.href='admin-login.html';">Logout</button>
        </div>

        <!-- Statistics Cards (Naya Feature) -->
        <div style="display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; margin-bottom: 20px;">
            <div class="table-container" style="padding: 20px; border-left: 4px solid #f39c12;">
                <h3 style="color: #bdc3c7; font-size: 14px; margin-bottom: 10px;">Total Trainees</h3>
                <h1 id="statTotal" style="color: #f39c12; font-size: 36px;">0</h1>
            </div>
            <div class="table-container" style="padding: 20px; border-left: 4px solid #2ecc71;">
                <h3 style="color: #bdc3c7; font-size: 14px; margin-bottom: 10px;">Approved</h3>
                <h1 id="statApproved" style="color: #2ecc71; font-size: 36px;">0</h1>
            </div>
            <div class="table-container" style="padding: 20px; border-left: 4px solid #e74c3c;">
                <h3 style="color: #bdc3c7; font-size: 14px; margin-bottom: 10px;">Pending</h3>
                <h1 id="statPending" style="color: #e74c3c; font-size: 36px;">0</h1>
            </div>
        </div>

        <!-- Add Trainee Section -->
        <div class="table-container" style="margin-bottom: 20px;">
            <h3>Add New Trainee</h3>
            <div style="display: flex; gap: 10px; flex-wrap: wrap; margin-top: 15px;">
                <input type="text" id="newName" placeholder="Full Name" style="flex: 1; min-width: 150px; padding:10px; border-radius:6px; border:1px solid #34495e; background:#1a252f; color:white;">
                <input type="text" id="newRoll" placeholder="Roll No" style="flex: 1; min-width: 120px; padding:10px; border-radius:6px; border:1px solid #34495e; background:#1a252f; color:white;">
                <input type="text" id="newPhone" placeholder="Phone (10 digit)" maxlength="10" style="flex: 1; min-width: 120px; padding:10px; border-radius:6px; border:1px solid #34495e; background:#1a252f; color:white;">
                <input type="password" id="newPass" placeholder="Password" style="flex: 1; min-width: 120px; padding:10px; border-radius:6px; border:1px solid #34495e; background:#1a252f; color:white;">
                <button class="btn" style="width:auto; padding:10px 25px; margin-top: 0;" id="addBtn">Add Trainee</button>
            </div>
        </div>

        <!-- Data Table -->
        <div class="table-container">
            <h3>Registered Trainees List</h3>
            <table>
                <thead>
                    <tr><th>ID</th><th>Name</th><th>Roll No</th><th>Phone</th><th>Status</th><th>Actions</th></tr>
                </thead>
                <tbody id="traineeTableBody"></tbody>
            </table>
        </div>

    </div>
    <script src="toast.js"></script>
    <script src="admin-dashboard.js"></script>
</body>
</html>
