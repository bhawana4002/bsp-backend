<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BSP C&IT Portal - Home</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
</head>
<body>

    <!-- Steel Plant Animation Layer -->
    <div class="bg-animation">
        <!-- Ghumti hui Steel Coils -->
        <div class="coil coil-1"></div>
        <div class="coil coil-2"></div>
        <div class="coil coil-3"></div>

        <!-- Aag ki Chingariyan (Sparks) -->
        <div class="spark" style="left: 10%; animation-delay: 0s;"></div>
        <div class="spark" style="left: 20%; animation-delay: 1.5s;"></div>
        <div class="spark" style="left: 30%; animation-delay: 3s;"></div>
        <div class="spark" style="left: 40%; animation-delay: 0.5s;"></div>
        <div class="spark" style="left: 50%; animation-delay: 2s;"></div>
        <div class="spark" style="left: 60%; animation-delay: 4s;"></div>
        <div class="spark" style="left: 70%; animation-delay: 1s;"></div>
        <div class="spark" style="left: 80%; animation-delay: 3.5s;"></div>
        <div class="spark" style="left: 90%; animation-delay: 2.5s;"></div>
        <div class="spark" style="left: 15%; animation-delay: 5s;"></div>
        <div class="spark" style="left: 65%; animation-delay: 4.5s;"></div>
        <div class="spark" style="left: 85%; animation-delay: 6s;"></div>
    </div>

    <div class="home-container">
        <h1>🏭 Bhilai Steel Plant</h1>
        <h2>C&IT Department - Management System</h2>
        <p>Welcome to the centralized portal for trainee management. Please select your login type below.</p>
        
        <div class="login-options">
            <a href="admin-login.html" class="btn-card">
                <span class="icon">🔒</span>
                <h3>Admin Login</h3>
                <p style="font-size:12px; color: #bdc3c7; margin-top: 5px;">Manage Trainees & Data</p>
            </a>
            <a href="trainee-login.html" class="btn-card">
                <span class="icon">🎓</span>
                <h3>Trainee Login</h3>
                <p style="font-size:12px; color: #bdc3c7; margin-top: 5px;">View Profile & Status</p>
            </a>
        </div>
        
        <p style="margin-top: 30px; font-size: 14px;">
            New Trainee? <a href="trainee-register.html" style="color: #f39c12; text-decoration: none; font-weight: bold;">Register Here</a>
        </p>
    </div>
    
    <script src="toast.js"></script>
</body>
</html>
