<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><title>Admin Login</title><link rel="stylesheet" href="style.css"></head>
<body>
    <div class="bg-animation"><div class="glow-ring ring1"></div><div class="scanner-line"></div></div>
    <div class="container">
        <h2>🔒 Admin Login</h2>
        <form id="adminLoginForm">
            <div class="input-group"><label>Admin ID</label><input type="text" id="adminId" placeholder="Enter ID" required></div>
            <div class="input-group"><label>Password</label><input type="password" id="adminPassword" placeholder="Enter Password" required></div>
            <button type="submit" class="btn">Login</button>
        </form>
        <p style="margin-top:15px;"><a href="index.html" style="color:#f39c12; text-decoration:none;">← Back to Home</a></p>
    </div>
    <script src="toast.js"></script><script src="admin-login.js"></script>
</body>
</html>
