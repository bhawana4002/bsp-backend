<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Trainee Dashboard</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="bg-animation">
        <div class="coil coil-1"></div><div class="coil coil-2"></div>
    </div>
    <div class="dashboard-container" style="max-width: 900px;">
        <div class="top-bar">
            <h2>🎓 My Dashboard</h2>
            <button class="btn-logout" onclick="localStorage.removeItem('loggedInTrainee'); window.location.href='trainee-login.html';">Logout</button>
        </div>

        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 20px;">
            <!-- Left Side: Profile -->
            <div class="id-card">
                <h3 style="color: #f39c12; border-bottom: 1px solid #34495e; padding-bottom: 10px; margin-bottom: 15px;">👤 My Profile</h3>
                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px;">
                    <div>
                        <h2 id="tName" style="text-align: left; margin: 0; color: white;">Name</h2>
                        <p id="tId" style="text-align: left; margin-top: 5px; color: #bdc3c7;">Year/Roll: --</p>
                    </div>
                    <div id="tStatus" class="status-badge">Status</div>
                </div>
                <div class="info-item" style="margin-bottom: 12px;"><label>College</label><p id="tCollege">--</p></div>
                <div class="info-item" style="margin-bottom: 12px;"><label>Project Title</label><p id="tProject">--</p></div>
                <div class="info-item" style="margin-bottom: 12px;"><label>Training From</label><p id="tFrom">--</p></div>
                <div class="info-item"><label>Training To</label><p id="tTo">--</p></div>
            </div>

            <!-- Right Side: Work Progress -->
            <div class="id-card" style="border-top: 5px solid #3498db;">
                <h3 style="color: #3498db; border-bottom: 1px solid #34495e; padding-bottom: 10px; margin-bottom: 15px;">📊 My Work Progress</h3>
                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 15px;">
                    <!-- Attendance -->
                    <div style="background: #1a252f; padding: 15px; border-radius: 8px; border-left: 3px solid #f39c12;">
                        <label style="font-size: 11px; color: #bdc3c7; text-transform: uppercase;">Attendance</label>
                        <p id="tAttendance" style="font-size: 16px; font-weight: bold; color: #f39c12; margin-top: 5px;">--</p>
                    </div>
                    <!-- Guide Name (Tasks ki jagah) -->
                    <div style="background: #1a252f; padding: 15px; border-radius: 8px; border-left: 3px solid #2ecc71;">
                        <label style="font-size: 11px; color: #bdc3c7; text-transform: uppercase;">Guide Name</label>
                        <p id="tGuide" style="font-size: 16px; font-weight: bold; color: #2ecc71; margin-top: 5px;">--</p>
                    </div>
                </div>
                <div style="margin-top: 20px;">
                    <label style="font-size: 12px; color: #bdc3c7;">Overall Completion</label>
                    <div style="width: 100%; background: #1a252f; border-radius: 10px; height: 10px; margin-top: 8px; overflow: hidden;">
                        <div id="progressBar" style="height: 100%; background: linear-gradient(90deg, #f39c12, #e67e22); width: 0%; transition: width 1s ease;"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <script src="toast.js"></script>
    <script src="trainee-dashboard.js"></script>
</body>
</html>
