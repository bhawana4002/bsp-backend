<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Trainee Login - BSP</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="bg-animation"><div class="coil coil-1"></div><div class="coil coil-2"></div></div>
    <div class="container">
        <h2>🎓 Trainee Login</h2>
        <form id="traineeLoginForm">
            <div class="input-group">
                <label>Year (YYYY)</label>
                <input type="number" id="traineeYear" placeholder="e.g. 2026" required>
            </div>
            <div class="input-group">
                <label>Roll Number</label>
                <input type="text" id="traineeRollNo" placeholder="e.g. P.12/1122" required>
            </div>
            <div class="input-group">
                <label>Password</label>
                <input type="password" id="traineePassword" placeholder="Enter Password" required>
            </div>
            <button type="submit" class="btn">Login</button>
        </form>
        <div style="display: flex; justify-content: space-between; margin-top: 15px; font-size: 14px;">
            <a href="index.html" style="color:#bdc3c7; text-decoration:none;">← Back</a>
            <a href="forgot-password.html" style="color:#f39c12; text-decoration:none;">Forgot Password?</a>
        </div>
    </div>
    <script src="toast.js"></script>
    <script src="trainee-login.js"></script>
</body>
</html>
