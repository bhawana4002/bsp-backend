<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Manage Attendance - BSP</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="bg-animation"><div class="coil coil-1"></div><div class="coil coil-2"></div></div>
    <div class="dashboard-container" style="max-width: 1000px;">
        <div class="top-bar">
            <h2>📅 Manage Attendance</h2>
            <button class="btn-logout" onclick="window.location.href='admin-dashboard.html';">← Back</button>
        </div>

        <!-- Mark Attendance Section -->
        <div class="table-container" style="margin-bottom: 20px;">
            <h3>Mark Attendance</h3>
            <div style="display: flex; gap: 10px; flex-wrap: wrap; margin-top: 15px;">
                <input type="number" id="attYear" placeholder="Year (e.g. 2026)" style="flex: 1; min-width:150px; padding:10px; border-radius:6px; border:1px solid #34495e; background:#1a252f; color:white;">
                <input type="text" id="attRollNo" placeholder="Roll No (e.g. P.12/1122)" style="flex: 1; min-width:150px; padding:10px; border-radius:6px; border:1px solid #34495e; background:#1a252f; color:white;">
                <input type="date" id="attDate" style="flex: 1; min-width:150px; padding:10px; border-radius:6px; border:1px solid #34495e; background:#1a252f; color:white;">
                <select id="attStatus" style="flex: 1; min-width:150px; padding:10px; border-radius:6px; border:1px solid #34495e; background:#1a252f; color:white;">
                    <option value="P">Present (P)</option>
                    <option value="A">Absent (A)</option>
                </select>
                <button class="btn" style="width: auto; padding: 10px 20px; margin:0;" id="markAttBtn">Mark</button>
            </div>
        </div>

        <!-- Attendance Report Section -->
        <div class="table-container">
            <h3>Attendance Summary (Har Trainee Ka)</h3>
            <table>
                <thead>
                    <tr>
                        <th>Year</th><th>Roll No</th><th>Name</th>
                        <th>Total Marked</th><th>Present</th><th>Absent</th>
                    </tr>
                </thead>
                <tbody id="attendanceReportBody">
                    <tr><td colspan="6" style="text-align:center;">Loading...</td></tr>
                </tbody>
            </table>
        </div>
    </div>
    <script src="toast.js"></script>
    <script src="attendance.js"></script>
</body>
</html>
