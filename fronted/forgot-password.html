<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Forgot Password</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="bg-animation"><div class="coil coil-1"></div><div class="coil coil-2"></div></div>
    <div class="container">
        <h2>🔑 Reset Password</h2>
        <p style="margin-bottom: 20px; font-size: 13px;">Enter your Trainee ID and registered Phone Number to reset your password.</p>
        <form id="forgotForm">
            <div class="input-group">
                <label>Trainee ID</label>
                <input type="text" id="fpId" placeholder="e.g. BSP5803" required>
            </div>
            <div class="input-group">
                <label>Registered Phone No</label>
                <input type="text" id="fpPhone" placeholder="Enter 10-digit Phone" maxlength="10" required>
            </div>
            <div class="input-group">
                <label>New Password</label>
                <input type="password" id="fpNewPass" placeholder="Enter New Password" required>
            </div>
            <button type="submit" class="btn">Reset Password</button>
        </form>
        <p style="text-align:center; margin-top:15px;"><a href="trainee-login.html" style="color:#f39c12; text-decoration:none;">Back to Login</a></p>
    </div>
    <script src="toast.js"></script>
    <script>
        document.getElementById("forgotForm").addEventListener("submit", function(e) {
            e.preventDefault();
            const id = document.getElementById("fpId").value.trim();
            const phone = document.getElementById("fpPhone").value.trim();
            const newPass = document.getElementById("fpNewPass").value;

            let trainees = JSON.parse(localStorage.getItem("bsp_trainees")) || [];
            const userIndex = trainees.findIndex(t => t.id === id && t.phone === phone);

            if (userIndex !== -1) {
                trainees[userIndex].password = newPass;
                localStorage.setItem("bsp_trainees", JSON.stringify(trainees));
                showToast("Password Reset Successful! Please Login.", "success");
                setTimeout(() => window.location.href = "trainee-login.html", 2000);
            } else {
                showToast("Invalid Trainee ID or Phone Number!", "error");
            }
        });
    </script>
</body>
</html>
